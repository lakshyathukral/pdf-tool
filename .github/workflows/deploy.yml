# Builds the site and publishes it to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run it by hand from the Actions tab.
  workflow_dispatch:

# Permissions this job needs to publish Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, abandon the older run rather than deploying stale
# code after newer code.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Nothing is published until the tests pass, so a broken change cannot reach
  # the live site. WebKit is the one that matters most here: it is what Safari
  # runs, and Safari is where this has broken before.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Browser tests
        run: npx playwright test

      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # npm ci installs exactly what package-lock.json records, so the build
      # machine gets the same versions as your Mac.
      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
